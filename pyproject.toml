[project]
name = "reconkit"
version = "0.2.0"
description = "A unified OSINT orchestrator CLI with an interactive menu that wraps best-in-class recon tools behind one interface."
authors = [{ name = "Carl Masters", email = "carlmasters1031@gmail.com" }]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "phonenumbers>=8.13",
    "Pillow>=10.0",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
reconkit = "reconkit.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["reconkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "network: makes DNS / HTTP lookups (enable with --run-network)",
    "live: runs an external recon CLI for real (enable with --run-live)",
]
